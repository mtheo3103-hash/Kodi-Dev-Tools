<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDT - Addon Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
</head>
<body class="bg-[#121212] text-[#e0e0e0] h-full flex flex-col font-sans">
    <header class="bg-[#1e1e1e] border-b border-[#2c2c2c] px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <a href="../index.html" class="bg-[#6200ee] text-white font-bold px-3 py-1 rounded text-xs uppercase">KDT</a>
            <span class="font-medium text-sm text-white">Addon Maker</span>
        </div>
        <div id="auth-header" class="flex items-center space-x-3 text-xs"></div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <div class="w-full md:w-64 bg-[#1e1e1e] border-r border-[#2c2c2c] flex flex-col p-4 space-y-4">
            <button onclick="saveProject()" class="w-full bg-[#6200ee] hover:bg-[#3700b3] text-white text-xs font-medium py-2.5 px-4 rounded-full transition shadow flex items-center justify-center">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i>In MongoDB speichern
            </button>
            <div class="space-y-1">
                <label class="text-[11px] text-[#a0a0a0] font-medium block">Addon ID</label>
                <input type="text" id="addon-id" value="plugin.video.betterkeybinds" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-md p-2 text-xs text-white focus:border-[#bb86fc] focus:outline-none">
            </div>
            <div class="pt-2">
                <span class="text-[11px] text-[#a0a0a0] font-semibold uppercase tracking-wider block mb-2">Dateien</span>
                <div id="file-list" class="space-y-1"></div>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-[#121212]">
            <div class="bg-[#1e1e1e] border-b border-[#2c2c2c] px-4 py-2.5 flex justify-between items-center">
                <span id="active-file" class="font-mono text-xs text-[#bb86fc] font-medium">default.py</span>
                <button onclick="publish()" class="bg-[#03dac6] hover:bg-[#018786] text-black text-xs font-semibold px-4 py-1.5 rounded-full transition shadow flex items-center">
                    <i class="fa-brands fa-github mr-2"></i>Auf GitHub pushen
                </button>
            </div>
            <textarea id="code-editor" class="w-full flex-1 bg-[#090909] font-mono text-xs p-4 text-[#e0e0e0] resize-none focus:outline-none leading-relaxed" spellcheck="false"></textarea>
        </div>
    </main>

    <!-- Modals -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-[#1e1e1e] border border-[#3c3c3c] w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl relative">
            <button onclick="document.getElementById('auth-modal').classList.add('hidden')" class="absolute top-4 right-4 text-[#a0a0a0]">✕</button>
            <h3 id="auth-title" class="font-medium text-base text-white">Anmelden</h3>
            <input type="text" id="auth-user" placeholder="Benutzername" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2.5 text-xs text-white focus:border-[#bb86fc] focus:outline-none">
            <input type="password" id="auth-pass" placeholder="Passwort" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2.5 text-xs text-white focus:border-[#bb86fc] focus:outline-none">
            <button onclick="submitAuth()" class="w-full bg-[#6200ee] text-white text-xs font-semibold p-2.5 rounded-full shadow">Bestätigen</button>
            <button onclick="toggleAuthMode()" class="text-[11px] text-[#bb86fc] w-full text-center hover:underline">Modus wechseln (Login / Registrieren)</button>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-[#1e1e1e] border border-[#3c3c3c] w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl relative">
            <button onclick="document.getElementById('settings-modal').classList.add('hidden')" class="absolute top-4 right-4 text-[#a0a0a0]">✕</button>
            <h3 class="font-medium text-base text-white">GitHub Token Einstellungen</h3>
            <input type="password" id="set-token" placeholder="GitHub Personal Access Token (ghp_...)" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2.5 text-xs text-white focus:border-[#bb86fc] focus:outline-none">
            <input type="text" id="set-repo" value="mtheo3103-hash/KDT" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2.5 text-xs text-white focus:border-[#bb86fc] focus:outline-none">
            <button onclick="saveSettings()" class="w-full bg-[#03dac6] text-black font-semibold text-xs p-2.5 rounded-full shadow">Speichern</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://kdt-backend-h2p7.onrender.com/api';
        let token = localStorage.getItem('kdt_token') || '';
        let username = localStorage.getItem('kdt_user') || '';
        let userId = localStorage.getItem('kdt_userid') || '';
        let isReg = false;

        let files = {
            'default.py': 'import xbmcgui\ndef main():\n    xbmcgui.Dialog().ok("BetterKeybinds", "Hello!")\nif __name__ == "__main__": main()',
            'addon.xml': '<?xml version="1.0" encoding="UTF-8"?>\n<addon id="plugin.video.betterkeybinds" name="BetterKeybinds" version="1.0.0">\n</addon>'
        };
        let currentFile = 'default.py';

        window.onload = () => {
            updateHeader();
            renderFileList();
            document.getElementById('code-editor').value = files[currentFile];
            document.getElementById('code-editor').oninput = (e) => files[currentFile] = e.target.value;
        };

        function updateHeader() {
            const h = document.getElementById('auth-header');
            if(token) {
                h.innerHTML = `<span class="text-[#a0a0a0]">${username} <span class="text-[10px] text-[#bb86fc]">(ID: ${userId})</span></span><button onclick="document.getElementById('settings-modal').classList.remove('hidden')" class="text-[#a0a0a0] hover:text-white ml-2"><i class="fa-solid fa-gear"></i></button><button onclick="logout()" class="text-[#cf6679] hover:underline ml-2">Logout</button>`;
            } else {
                h.innerHTML = `<button onclick="document.getElementById('auth-modal').classList.remove('hidden')" class="bg-[#2c2c2c] hover:bg-[#3c3c3c] text-white px-3 py-1.5 rounded-full text-xs font-medium">Login</button>`;
            }
        }

        function toggleAuthMode() { isReg = !isReg; document.getElementById('auth-title').innerText = isReg ? 'Registrieren' : 'Anmelden'; }
        async function submitAuth() {
            const u = document.getElementById('auth-user').value;
            const p = document.getElementById('auth-pass').value;
            const res = await fetch(API_URL + (isReg ? '/register' : '/login'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p})});
            const d = await res.json();
            if(!res.ok) return alert(d.error);
            if(isReg) { alert(`Registriert! Deine ID ist: ${d.userId}. Bitte jetzt einloggen.`); toggleAuthMode(); }
            else { token = d.token; username = d.username; userId = d.userId; localStorage.setItem('kdt_token', token); localStorage.setItem('kdt_user', username); localStorage.setItem('kdt_userid', userId); document.getElementById('auth-modal').classList.add('hidden'); updateHeader(); alert('Eingeloggt!'); }
        }
        function logout() { localStorage.clear(); token=''; username=''; userId=''; updateHeader(); }
        async function saveSettings() {
            await fetch(API_URL + '/settings', {method:'POST', headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${token}`}, body:JSON.stringify({githubToken:document.getElementById('set-token').value, githubRepo:document.getElementById('set-repo').value})});
            alert('Einstellungen gespeichert!'); document.getElementById('settings-modal').classList.add('hidden');
        }
        async function saveProject() {
            if(!token) return alert('Bitte erst einloggen!');
            const name = document.getElementById('addon-id').value;
            const res = await fetch(API_URL + '/projects', {method:'POST', headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${token}`}, body:JSON.stringify({name, type:'addon', data:files})});
            const d = await res.json();
            alert(d.message || 'Erfolgreich gespeichert!');
        }
        function renderFileList() {
            const l = document.getElementById('file-list'); l.innerHTML = '';
            Object.keys(files).forEach(f => {
                l.innerHTML += `<div onclick="currentFile='${f}'; document.getElementById('active-file').innerText='${f}'; document.getElementById('code-editor').value=files['${f}']; renderFileList();" class="p-2.5 rounded-lg text-xs cursor-pointer ${f===currentFile?'bg-[#2c2c2c] text-[#bb86fc] font-medium':'text-[#a0a0a0] hover:bg-[#252525]'}">${f}</div>`;
            });
        }
        async function publish() {
            if(!token) return alert('Bitte erst einloggen!');
            const id = document.getElementById('addon-id').value;
            const payload = Object.keys(files).map(k => ({path: `repo/${id}/${k}`, content: files[k]}));
            const res = await fetch(API_URL + '/publish-github', {method:'POST', headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${token}`}, body:JSON.stringify({files:payload})});
            const d = await res.json();
            if(!res.ok) return alert(d.error);
            alert('Erfolgreich auf GitHub gepusht!');
        }
    </script>
</body>
</html>
