<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDT - Repo & Media Source Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
</head>
<body class="bg-[#121212] text-[#e0e0e0] h-full flex flex-col font-sans">
    
    <!-- Top App Bar -->
    <header class="bg-[#1e1e1e] border-b border-[#2c2c2c] px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <a href="../index.html" class="bg-[#6200ee] text-white font-bold px-3 py-1 rounded text-xs uppercase">KDT</a>
            <span class="font-medium text-sm text-white">Repo & Media Source Maker</span>
        </div>
        <div id="auth-status" class="text-xs text-[#a0a0a0]">Nicht eingeloggt</div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-8 max-w-2xl mx-auto w-full flex flex-col justify-center space-y-6">
        <div class="bg-[#1e1e1e] border border-[#3c3c3c] w-full rounded-2xl p-6 space-y-5 shadow-2xl">
            
            <h2 class="font-medium text-base text-white border-b border-[#2c2c2c] pb-3">Kodi Repository Builder</h2>
            
            <div class="space-y-4">
                <!-- Repo Name -->
                <div>
                    <label class="block text-xs font-medium text-[#a0a0a0] mb-1">Repository Name (z.B. ExampleRepoByMat)</label>
                    <input type="text" id="repo-name" value="ExampleRepoByMat" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2.5 text-xs text-white focus:border-[#bb86fc] focus:outline-none">
                </div>

                <!-- Beschreibung -->
                <div>
                    <label class="block text-xs font-medium text-[#a0a0a0] mb-1">Kodi Beschreibung (Description)</label>
                    <textarea id="repo-desc" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2.5 text-xs text-white focus:border-[#bb86fc] focus:outline-none h-16 resize-none">Offizielles Repository für meine Kodi Addons.</textarea>
                </div>

                <!-- Repo Icon Upload -->
                <div>
                    <label class="block text-xs font-medium text-[#a0a0a0] mb-1">Repository Bild / Icon (icon.png)</label>
                    <input type="file" id="repo-icon" accept="image/png, image/jpeg" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2 text-xs text-white file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-[#6200ee] file:text-white hover:file:bg-[#3700b3]">
                </div>

                <!-- Addons aus MongoDB auswählen -->
                <div class="space-y-2">
                    <label class="block text-xs font-medium text-[#bb86fc]">1. Addons aus deiner MongoDB-Sandbox auswählen:</label>
                    <div id="mongo-addons-list" class="bg-[#121212] border border-[#3c3c3c] rounded-lg p-3 max-h-32 overflow-y-auto space-y-2 text-xs">
                        <span class="text-[#a0a0a0]">Lade Addons...</span>
                    </div>
                </div>

                <!-- Lokale ZIP-Dateien hochladen -->
                <div class="space-y-2">
                    <label class="block text-xs font-medium text-[#bb86fc]">2. Oder lokale ZIP-Dateien hinzufügen:</label>
                    <input type="file" id="local-zips" multiple accept=".zip" class="w-full bg-[#121212] border border-[#3c3c3c] rounded-lg p-2 text-xs text-white file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-[#2c2c2c] file:text-white hover:file:bg-[#3c3c3c]">
                </div>

                <!-- OPTIONAL: Eigene Willkommens-Website -->
                <div class="space-y-2 pt-2 border-t border-[#2c2c2c]">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-medium text-[#bb86fc] cursor-pointer flex items-center">
                            <input type="checkbox" id="enable-custom-index" onchange="toggleCustomIndex()" class="mr-2 rounded bg-[#121212] border-[#3c3c3c] text-[#6200ee]">
                            Eigene Willkommens-Website (index.html) hinzufügen
                        </label>
                    </div>
                    <div id="custom-index-container" class="hidden space-y-1">
                        <label class="text-[11px] text-[#a0a0a0] block">HTML-Inhalt für deine Willkommensseite:</label>
                        <textarea id="custom-index-html" class="w-full bg-[#121212] font-mono text-xs border border-[#3c3c3c] rounded-lg p-2.5 text-white focus:border-[#bb86fc] focus:outline-none h-32 resize-none" spellcheck="false">&lt;div class=&quot;space-y-4&quot;&gt;
    &lt;h2 class=&quot;text-2xl font-bold text-[#bb86fc]&quot;&gt;Willkommen in meinem Repo!&lt;/h2&gt;
    &lt;p class=&quot;text-sm text-slate-300&quot;&gt;Hier findest du meine neuesten Kodi Addons und Erweiterungen.&lt;/p&gt;
    &lt;div class=&quot;bg-[#121212] p-3 rounded border border-[#3c3c3c] text-xs font-mono&quot;&gt;
        Medienquelle in Kodi hinzufügen: &lt;span class=&quot;text-emerald-400&quot;&gt;URL kopieren&lt;/span&gt;
    &lt;/div&gt;
&lt;/div&gt;</textarea>
                    </div>
                </div>
            </div>

            <button onclick="buildAndPublishRepo()" class="w-full bg-[#03dac6] hover:bg-[#018786] text-black text-xs font-semibold p-3 rounded-full transition shadow flex items-center justify-center">
                <i class="fa-brands fa-github mr-2 text-sm"></i>Repository erstellen & auf GitHub pushen
            </button>
            
            <!-- Result Box -->
            <div id="result-box" class="hidden space-y-2 pt-3 border-t border-[#2c2c2c]">
                <div class="bg-[#121212] border border-[#03dac6]/40 p-4 rounded-xl space-y-2">
                    <span class="text-xs font-bold text-[#03dac6] flex items-center"><i class="fa-solid fa-circle-check mr-1.5"></i>Repository erfolgreich erstellt!</span>
                    <p class="text-[11px] text-[#a0a0a0]">Kopiere diesen Link und füge ihn in Kodi als Medienquelle hinzu:</p>
                    <div class="flex items-center space-x-2 pt-1">
                        <input type="text" id="kodi-url-output" readonly class="w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded-lg p-2 text-xs font-mono text-white select-all">
                        <button onclick="copyRepoUrl()" class="bg-[#2c2c2c] hover:bg-[#3c3c3c] text-white px-3 py-2 rounded-lg text-xs transition"><i class="fa-regular fa-copy"></i></button>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        const API_URL = 'https://kdt-backend-h2p7.onrender.com/api';
        const token = localStorage.getItem('kdt_token') || '';
        let userAddons = [];

        window.onload = async () => {
            if (token) {
                document.getElementById('auth-status').innerHTML = `<span class="text-[#bb86fc]">Eingeloggt als ${localStorage.getItem('kdt_user')}</span>`;
                await fetchUserAddons();
            } else {
                document.getElementById('mongo-addons-list').innerHTML = `<span class="text-[#cf6679]">Bitte zuerst im Addon Maker einloggen, um deine Addons zu sehen.</span>`;
            }
        };

        function toggleCustomIndex() {
            const container = document.getElementById('custom-index-container');
            const isChecked = document.getElementById('enable-custom-index').checked;
            if(isChecked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        async function fetchUserAddons() {
            try {
                const res = await fetch(API_URL + '/my-addons', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                userAddons = await res.json();
                const listEl = document.getElementById('mongo-addons-list');
                listEl.innerHTML = '';

                if (userAddons.length === 0) {
                    listEl.innerHTML = `<span class="text-[#a0a0a0]">Keine Addons in der MongoDB gefunden. Du kannst unten lokale ZIPs hochladen.</span>`;
                    return;
                }

                userAddons.forEach((addon) => {
                    listEl.innerHTML += `
                        <label class="flex items-center space-x-2 cursor-pointer text-white">
                            <input type="checkbox" value="${addon.name}" class="mongo-addon-checkbox rounded bg-[#1e1e1e] border-[#3c3c3c] text-[#6200ee]">
                            <span>${addon.name} <span class="text-[10px] text-[#a0a0a0]">(MongoDB Sandbox)</span></span>
                        </label>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function buildAndPublishRepo() {
            if(!token) return alert('Bitte zuerst im Addon Maker einloggen!');
            const repoName = document.getElementById('repo-name').value.trim();
            const repoDesc = document.getElementById('repo-desc').value.trim();
            if(!repoName) return alert('Bitte Repository-Namen eingeben!');

            let filesToUpload = [];

            // 1. Repo addon.xml generieren
            const addonXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<addon id="${repoName}" name="${repoName}" version="1.0.0" provider-name="KDT">
    <requires>
        <import addon="xbmc.python" version="3.0.0"/>
    </requires>
    <extension point="xbmc.addon.metadata">
        <platform>all</platform>
        <summary lang="en">${repoDesc}</summary>
        <description lang="en">${repoDesc}</description>
    </extension>
</addon>`;
            filesToUpload.push({ path: `repositories/${repoName}/addon.xml`, content: addonXml, isBase64: false });

            // 2. Repo Icon verarbeiten, falls ausgewählt
            const iconInput = document.getElementById('repo-icon');
            if(iconInput.files.length > 0) {
                const base64Icon = await fileToBase64(iconInput.files[0]);
                filesToUpload.push({ path: `repositories/${repoName}/icon.png`, content: base64Icon, isBase64: true });
            }

            // 3. Ausgewählte MongoDB-Addons als ZIP verpacken
            const selectedCheckboxes = document.querySelectorAll('.mongo-addon-checkbox:checked');
            for(const cb of selectedCheckboxes) {
                const addonData = userAddons.find(a => a.name === cb.value);
                if(addonData && addonData.data) {
                    const zip = new JSZip();
                    const folder = zip.folder(addonData.name);
                    for(const [fileName, fileContent] of Object.entries(addonData.data)) {
                        folder.file(fileName, fileContent);
                    }
                    const zipBlob = await zip.generateAsync({type: 'base64'});
                    filesToUpload.push({
                        path: `repositories/${repoName}/${addonData.name}.zip`,
                        content: zipBlob,
                        isBase64: true
                    });
                }
            }

            // 4. Lokale ZIP-Dateien verarbeiten
            const localZips = document.getElementById('local-zips').files;
            for(let i=0; i<localZips.length; i++) {
                const file = localZips[i];
                const base64Zip = await fileToBase64(file);
                filesToUpload.push({
                    path: `repositories/${repoName}/${file.name}`,
                    content: base64Zip,
                    isBase64: true
                });
            }

            // 5. Willkommens-Website (index.html) generieren
            const useCustom = document.getElementById('enable-custom-index').checked;
            let introHtml = '';
            if (useCustom) {
                const userHtmlContent = document.getElementById('custom-index-html').value;
                introHtml = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>${repoName}</title><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-[#121212] text-[#e0e0e0] min-h-screen flex items-center justify-center p-6"><div class="max-w-xl w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded-2xl p-8 shadow-2xl">${userHtmlContent}</div></body></html>`;
            } else {
                introHtml = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>${repoName}</title><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-[#121212] text-[#e0e0e0] min-h-screen flex items-center justify-center p-6"><div class="max-w-md w-full bg-[#1e1e1e] border border-[#3c3c3c] rounded-2xl p-8 text-center space-y-4 shadow-2xl"><h1 class="text-xl font-bold text-[#bb86fc]">${repoName}</h1><p class="text-xs text-[#a0a0a0]">${repoDesc}</p><div class="bg-[#121212] p-3 rounded-xl border border-[#2c2c2c] text-xs font-mono text-emerald-400 select-all">https://mtheo3103-hash.github.io/KDT/repositories/${repoName}/</div></div></body></html>`;
            }
            filesToUpload.push({ path: `repositories/${repoName}/index.html`, content: introHtml, isBase64: false });

            try {
                const res = await fetch(API_URL + '/publish-github', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json', 'Authorization':`Bearer ${token}`},
                    body: JSON.stringify({ files: filesToUpload })
                });
                const d = await res.json();
                if(!res.ok) return alert(d.error || 'Fehler beim Pushen');

                const directUrl = `https://mtheo3103-hash.github.io/KDT/repositories/${repoName}/`;
                document.getElementById('kodi-url-output').value = directUrl;
                document.getElementById('result-box').classList.remove('hidden');
                alert('Repository und Willkommens-Website erfolgreich veröffentlicht!');
            } catch (err) {
                alert('Verbindungsfehler: ' + err.message);
            }
        }

        function copyRepoUrl() {
            const copyText = document.getElementById('kodi-url-output');
            copyText.select();
            document.execCommand('copy');
            alert('Kodi Media Source Link in die Zwischenablage kopiert!');
        }
    </script>
</body>
</html>
